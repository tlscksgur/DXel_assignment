<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
  <title>비밀번호 재설정 | 명함관리</title>
</head>
<body class="authPage">
  <header><div class="headerBox1"><a class="logo" href="./index.html">명함관리</a></div><div class="headerBox2"></div></header>
  <main>
    <section class="authCard">
      <p class="authEyebrow">PASSWORD RECOVERY</p>
      <h1>비밀번호 재설정</h1>
      <p class="authIntro">가입한 이메일 주소로 한 번 사용할 수 있는 재설정 링크를 보냅니다.</p>
      <form class="authForm" data-auth-form="reset-request">
        <label>이메일<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
        <button class="authPrimaryButton" type="submit">재설정 링크 보내기</button>
      </form>
      <form class="authForm" data-auth-form="reset-complete" hidden>
        <label>새 비밀번호<input name="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
        <button class="authPrimaryButton" type="submit">비밀번호 저장</button>
      </form>
      <p class="authStatus" aria-live="polite"></p>
      <nav class="authLinks"><a href="./login.html">로그인으로 돌아가기</a></nav>
    </section>
  </main>
  <script>
    if (new URLSearchParams(location.search).has("token")) {
      document.querySelector('[data-auth-form="reset-request"]').hidden = true;
      document.querySelector('[data-auth-form="reset-complete"]').hidden = false;
      document.querySelector(".authIntro").textContent = "새 비밀번호를 입력해 주세요. 링크는 한 번만 사용할 수 있습니다.";
    }
  </script>
  <script src="./js/authUI.js"></script>
  <script src="./js/authPages.js"></script>
</body>
</html>
