<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <title>DXel</title>
</head>
<body>
  <div class="container">
    <!-- ===== 공통 헤더 및 페이지 이동 ===== -->
    <header>
      <div class="headerBox1">
        <div class="logo">명함관리</div>
        <ul>
          <li><a href="./index.html" class="active">홈</a></li>
          <li><a href="./BCM.html">명함관리</a></li>
        </ul>
      </div>
      <div class="headerBox2">
        <a href="./cardAdd.html" class="cardAdd">+ 명함등록</a>
      </div>
    </header>

    <!-- ===== 최근 등록 명함 슬라이드 ===== -->
    <main>
      <section class="mainTitle">
        <div>
          <h1>Business Card</h1>
          <p>Manage and check recently registered business cards.</p>
        </div>
      </section>

      <section class="cardArea">
        <div class="cardTrack" id="cardTrack"></div>
      </section>
    </main>

    <!-- ===== 서비스 연결 상태 및 내보내기 ===== -->
    <footer>
      <div class="footerLeft">
        (c) 2026 DXEL BUSINESS CARD MANAGER
      </div>

      <div class="footerRight">
        <span class="sync serviceStatus serviceStatusOff" data-service="local-ai">
          <i></i>
          Local AI Ready
        </span>

        <span class="serviceStatus serviceStatusOff" data-service="sqlite">
          <i></i>
          SQLite
        </span>
        <span class="csvExport">CSV Export</span>
        <span class="vcardExport">vCard Export</span>
      </div>
    </footer>
  </div>

  <!-- ===== 화면 동작 스크립트 ===== -->
  <script src="./js/footerStatus.js"></script>
  <script src="./js/slide.js"></script>
</body>
</html>
