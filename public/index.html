    <footer>
      <div class="footerGarden" aria-hidden="true">
        <svg class="gardenPlant gardenPlant--daisy" viewBox="0 0 32 44">
          <path d="M16 42V20M16 33Q5 24 6 34Q12 38 16 36M16 29Q27 21 26 30Q22 34 16 33"/>

          <path d="M15 29V16M15 20C2 21 3 8 4 8C14 7 16 17 15 20ZM15 18C15 7 26 7 27 8C27 17 20 21 15 18Z" fill="var(--garden-leaf)"/>

        <svg class="gardenPinwheel gardenPinwheel--one" viewBox="0 0 44 68">
          <path d="M22 65V23"/>
          <g class="gardenPinwheelBlades">
            <path d="M22 22L8 4L22 5Z" fill="var(--garden-leaf)"/><path d="M22 22L40 8L39 22Z" fill="var(--garden-petal)"/>

          <path d="M22 65V23"/>

            <path d="M22 22L8 4L22 5Z" fill="var(--garden-petal)"/><path d="M22 22L40 8L39 22Z" fill="var(--garden-leaf)"/>

            <path d="M14 24Q18 27 22 24"/>
            <rect x="15" y="29" width="6" height="3" rx="1" fill="var(--garden-leaf)" stroke="none"/>
