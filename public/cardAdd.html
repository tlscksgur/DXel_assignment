<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/cardAdd.css">
  <title>DXel Card Add</title>
</head>
<body class="card-add-page">
  <div class="container">
    <header>
      <div class="headerBox1">
        <div class="logo">명함관리</div>
        <ul>
          <li><a href="./index.html">홈</a></li>
          <li><a href="./BCM.html">명함관리</a></li>
        </ul>
      </div>
      <div class="headerBox2">
        <a href="./cardAdd.html" class="cardAdd subActive">+ 명함등록</a>
      </div>
    </header>

    <main class="addMain">
      <section class="addTitle">
        <div>
          <span class="eyebrow">IMAGE TO TEXT</span>
          <h1>명함 추가</h1>
          <p>명함 사진을 올린 뒤 추출된 정보를 확인하고 저장하세요.</p>
        </div>
        <!-- <div class="processStatus">
          <span class="active">01 업로드</span>
          <span class="active">02 확인</span>
          <span>03 저장</span>
        </div> -->
      </section>

      <section class="reviewBoard" aria-label="명함 추출 결과 확인">
        <aside class="uploadPanel">
          <div class="uploadBox">
            <button class="uploadTrigger" type="button">
              <span class="uploadIcon">+</span>
              <strong>명함 사진 업로드</strong>
              <em>휴대폰 촬영 또는 파일 선택</em>
            </button>
            <input class="uploadFileInput" type="file" id="cardCameraInput" accept="image/*" capture="environment">
            <input class="uploadFileInput" type="file" id="cardGalleryInput" accept="image/*" multiple>
          </div>

          <div class="previewFrame">
            <div class="emptyPreview">
              <span>NO IMAGE</span>
              <p>명함 사진을 업로드하면 이곳에 표시됩니다.</p>
            </div>
          </div>

          <div class="queueBox">
            <div class="queueHeader">
              <span>연속 업로드</span>
              <b>0장 대기</b>
            </div>
            <p class="emptyQueue">업로드한 명함이 없습니다.</p>
          </div>
        </aside>

        <section class="actionDock" aria-label="명함 등록 작업">
          <div class="actionButtons">
            <button class="ghostAction" type="button">취소</button>
            <button class="subAction" type="button">다음 명함</button>
            <button class="mainAction" type="button">확인 후 저장</button>
          </div>
        </section>

        <section class="extractPanel">
          <div class="panelHeader">
            <div>
              <span class="eyebrow">EXTRACTION RESULT</span>
              <h2>추출 결과 확인</h2>
            </div>
            <span class="runningBadge">업로드 대기</span>
          </div>

          <form class="extractForm">
            <div class="fieldGroup identity">
              <label for="name">이름</label>
              <input type="text" id="name">
            </div>

            <div class="fieldGroup">
              <label for="company">회사</label>
              <input type="text" id="company">
            </div>

            <div class="fieldGroup">
              <label for="department">부서</label>
              <input type="text" id="department">
            </div>

            <div class="fieldGroup">
              <label for="position">직책</label>
              <input type="text" id="position">
            </div>

            <div class="fieldGroup">
              <label for="mobile">휴대폰</label>
              <input type="tel" id="mobile">
            </div>

            <div class="fieldGroup">
              <label for="phone">유선전화</label>
              <input type="tel" id="phone">
            </div>

            <div class="fieldGroup wide">
              <label for="email">이메일</label>
              <input type="email" id="email">
            </div>

            <div class="fieldGroup wide">
              <label for="homepage">홈페이지</label>
              <input type="url" id="homepage">
            </div>

            <div class="fieldGroup wide">
              <label for="address">주소</label>
              <textarea id="address" rows="3"></textarea>
            </div>
          </form>

        </section>
      </section>
    </main>

    <footer>
      <div class="footerLeft">
        (c) 2026 DXEL BUSINESS CARD MANAGER
      </div>

      <div class="footerRight">
        <span class="sync serviceStatus serviceStatusOff" data-service="local-ai">
          <i></i>
          Local AI Ready
        </span>

        <span class="serviceStatus serviceStatusOff" data-service="sqlite">
          <i></i>
          SQLite
        </span>
        <span class="csvExport">CSV Export</span>
        <span class="vcardExport">vCard Export</span>
      </div>
    </footer>
  </div>

  <div class="uploadSourceSheet" hidden>
    <button
      class="uploadSourceBackdrop"
      type="button"
      aria-label="업로드 선택창 닫기"
    ></button>
    <section
      class="uploadSourcePanel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="uploadSourceTitle"
    >
      <h2 id="uploadSourceTitle">명함 사진 추가</h2>
      <p>사진을 가져올 방법을 선택하세요.</p>
      <button class="uploadSourceCamera" type="button">사진 촬영</button>
      <button class="uploadSourceGallery" type="button">사진 선택</button>
      <button class="uploadSourceCancel" type="button">취소</button>
    </section>
  </div>

  <script src="./js/footerStatus.js"></script>
  <script src="./js/cardAdd.js"></script>
</body>
</html>
