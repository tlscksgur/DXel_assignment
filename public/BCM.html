<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/BCM.css">
  <title>DXel BCM</title>
</head>
<body class="bcm-page">
  <div class="container">
    <!-- ===== 공통 헤더 및 페이지 이동 ===== -->
    <header>
      <div class="headerBox1">
        <div class="logo">명함관리</div>
        <ul>
          <li><a href="./index.html">홈</a></li>
          <li><a href="./BCM.html" class="active">명함관리</a></li>
          <li><a href="./cardImport.html">명함 데이터 불러오기</a></li>
        </ul>
      </div>
      <div class="headerBox2">
        <a href="./cardAdd.html" class="cardAdd">+ 명함등록</a>
      </div>
    </header>

    <!-- ===== 명함 검색·보기 전환·목록 ===== -->
    <main class="bcmMain">
      <section class="bcmTools" aria-label="명함 검색 및 보기 설정">
        <form class="cardSearchForm" role="search">
          <div class="cardSearchField">
            <label for="cardSearch">이름 또는 회사 검색</label>
            <input
              type="search"
              id="cardSearch"
              placeholder="이름 또는 회사로 검색"
              autocomplete="off"
            >
            <button type="submit">검색</button>
          </div>
        </form>
        <div class="cardListControls">
          <p class="resultSummary" aria-live="polite">전체 0장</p>
          <div class="viewModeControls" aria-label="명함 보기 방식">
            <button class="allViewToggle active" type="button" aria-pressed="true">전체</button>
            <button class="groupViewToggle" type="button" aria-pressed="false">그룹별 보기</button>
            <button class="tagViewToggle" type="button" aria-pressed="false">태그별 보기</button>
            <button class="duplicateToggle" type="button" aria-pressed="false">
              중복 의심 보기
              <span class="duplicateCountBadge" hidden>0</span>
            </button>
          </div>
          <div class="sortControls" aria-label="명함 정렬 방식">
            <select class="cardSortSelect" aria-label="정렬 기준">
              <option value="recent">최근 등록순</option>
              <option value="name">이름순</option>
              <option value="company">회사순</option>
            </select>
            <select class="tagFilterSelect" hidden aria-label="표시할 태그">
              <option value="">전체 태그</option>
              <option value="고객">고객</option>
              <option value="잠재 고객">잠재 고객</option>
              <option value="협력사">협력사</option>
              <option value="공급업체">공급업체</option>
              <option value="파트너사">파트너사</option>
              <option value="내부">내부</option>
              <option value="기타">기타</option>
            </select>
            <div class="sortDirectionControls" aria-label="정렬 방향">
              <button class="sortDirectionButton" type="button" data-sort-direction="asc" aria-pressed="false">오름차순</button>
              <button class="sortDirectionButton active" type="button" data-sort-direction="desc" aria-pressed="true">내림차순</button>
            </div>
            <button class="favoriteViewToggle" type="button" aria-pressed="false" aria-label="즐겨찾기 명함만 보기" title="즐겨찾기 명함만 보기">☆</button>
          </div>
          <button class="selectionToggle" type="button" aria-pressed="false">
            <span class="selectionToggleIcon" aria-hidden="true">✓</span>
            <span>선택</span>
            <strong class="selectionInlineCount" hidden>(0개 선택됨)</strong>
          </button>
        </div>
      </section>

      <section class="bcmBoard" aria-label="명함 목록"></section>

      <aside class="selectionActionBar" aria-label="선택한 명함 작업" hidden>
        <span class="selectionBarCount">
          <strong class="selectionBarCountValue">0</strong>
          <span>개 선택됨</span>
        </span>
        <button type="button" data-selection-action="export-csv">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z" />
            <path d="M14 3v6h6M8 14h8M8 17h5" />
          </svg>
          CSV
        </button>
        <button type="button" data-selection-action="export-vcard">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <circle cx="9" cy="11" r="2" />
            <path d="M6.5 16c.7-1.5 1.5-2 2.5-2s1.8.5 2.5 2M14 10h4M14 14h4" />
          </svg>
          vCard
        </button>
        <button type="button" data-selection-action="group">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
          </svg>
          그룹 지정
        </button>
        <button type="button" data-selection-action="remove-from-group" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
            <path d="M9 13h6" />
          </svg>
          그룹에서 제거
        </button>
        <button type="button" data-selection-action="delete">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6" />
          </svg>
          휴지통으로 이동
        </button>
      </aside>
    </main>

    <!-- ===== 선택한 명함 그룹 지정 ===== -->
    <dialog class="groupAssignModal" aria-labelledby="groupAssignTitle">
      <form class="groupAssignForm" method="dialog">
        <header class="groupAssignHeader">
          <div>
            <h2 id="groupAssignTitle">그룹 지정</h2>
            <p>선택한 명함에 배정할 그룹을 선택하거나 새 그룹을 입력하세요.</p>
          </div>
          <button class="groupAssignClose" type="button" data-group-action="cancel" aria-label="그룹 지정 닫기">×</button>
        </header>

        <section class="groupAssignTargets" aria-label="선택한 명함">
          <span>적용 대상</span>
          <div class="groupAssignSelectedCards"></div>
        </section>

        <section class="groupAssignBody">
          <div class="groupAssignLabelRow">
            <label for="groupName">그룹 이름</label>
            <span class="groupAssignExistingCount"></span>
          </div>
          <input id="groupName" name="groupName" maxlength="40" autocomplete="off" placeholder="새 그룹 이름을 입력하세요" required>

          <div class="groupQuickSection">
            <p>기존 그룹에서 빠른 선택</p>
            <div class="groupQuickList" role="list"></div>
          </div>
        </section>

        <p class="groupAssignStatus" aria-live="polite"></p>
        <div class="groupAssignActions">
          <button type="button" data-group-action="cancel">취소</button>
          <button type="submit">지정</button>
        </div>
      </form>
    </dialog>

    <!-- ===== 명함 상세 조회·수정·삭제 모달 ===== -->
    <dialog class="cardDetailModal" aria-labelledby="cardDetailTitle">
      <div class="cardDetailContent"></div>
      <button class="cardDetailClose" type="button" aria-label="명함 상세 닫기">×</button>
    </dialog>

    <!-- ===== 서비스 연결 상태 및 내보내기 ===== -->
    <footer>
      <div class="footerLeft">
        (c) 2026 DXEL BUSINESS CARD MANAGER
      </div>

      <div class="footerRight">
        <a class="trashFooterLink" href="./cardTrash.html" aria-label="휴지통으로 이동" title="휴지통">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6" /></svg>
          <span>휴지통</span>
        </a>
        <span class="footerDivider" aria-hidden="true"></span>

        <span class="sync serviceStatus serviceStatusOff" data-service="local-ai">
          <i></i>
          Local AI Ready
        </span>
        <span class="csvExport">CSV Export</span>
        <span class="vcardExport">vCard Export</span>
      </div>
    </footer>
  </div>
  <!-- ===== 화면 동작 스크립트 ===== -->
  <script src="./js/footerStatus.js"></script>
  <script src="./js/cardManagement.js"></script>
</body>
</html>
