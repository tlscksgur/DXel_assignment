# 최초 HTTP 연결 점검용. 실제 계정 운영 전 TLS 인증서를 연결하세요.
server {
    listen 7777;
    server_name 61.39.70.66;
    client_max_body_size 15m;

    location = /businessCard {
        return 308 /businessCard/$is_args$args;
    }

    location /businessCard/ {
        # 끝에 /를 붙이지 않아 앱 경로를 그대로 전달합니다.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # 분석·필드 재확인은 각각 최대 300초이므로 중간에 프록시가 끊지 않도록 설정합니다.
        proxy_read_timeout 660s;
    }

    # 다른 웹은 별도 location과 서로 다른 내부 포트로 추가하세요.
    location / {
        return 404;
    }
}
